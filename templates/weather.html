<!DOCTYPE html>
<!-- ABOUTME: Renders the weather dashboard shell and loads its client assets. -->
<!-- ABOUTME: Applies canonical dashboard configuration before widget startup. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <meta name="description" content="A real-time weather dashboard with forecasts and current conditions">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Weather Dashboard">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-tap-highlight" content="no">

    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/static/icons/app-icon.svg">
    <link rel="apple-touch-icon" href="/static/icons/app-icon.svg">
    <link rel="mask-icon" href="/static/icons/app-icon.svg" color="#3b82f6">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="/static/css/weather-components.css">
    <style>
        :root {
            /* Default theme (blue gradient) */
            --bg-primary: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
            --text-primary: white;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --error-color: #fca5a5;
            --connection-bg-connected: #10b981;
            --connection-bg-polling: #f59e0b;
            --connection-bg-disconnected: #ef4444;
            --temp-high: #fef3c7;
            --temp-low: #dbeafe;
            --help-surface: rgba(15, 23, 42, 0.92);
            --help-param-color: #fef3c7;
            --help-example-color: #dbeafe;
            --insight-surface: rgba(15, 23, 42, 0.45);
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --text-primary: #000000;
            --card-bg: rgba(0, 0, 0, 0.05);
            --card-border: rgba(0, 0, 0, 0.1);
            --error-color: #dc2626;
            --connection-bg-connected: #10b981;
            --connection-bg-polling: #f59e0b;
            --connection-bg-disconnected: #ef4444;
            --temp-high: #b45309;
            --temp-low: #0369a1;
            --help-surface: #f8fafc;
            --help-param-color: #92400e;
            --help-example-color: #0369a1;
            --insight-surface: #f8fafc;
        }

        [data-theme="eink"] {
            /* High contrast theme for eInk displays */
            --bg-primary: #eeeeee;
            --text-primary: #000000;
            --card-bg: #ffffff;
            --card-border: #000000;
            --error-color: #000000;
            --connection-bg-connected: #000000;
            --connection-bg-polling: #000000;
            --connection-bg-disconnected: #000000;
            --temp-high: currentColor;
            --temp-low: currentColor;
            --help-surface: #ffffff;
            --help-param-color: currentColor;
            --help-example-color: currentColor;
            --insight-surface: #ffffff;
        }

        /* Future theme examples:
        [data-theme="dark"] {
            --bg-primary: #1f2937;
            --text-primary: #f9fafb;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --error-color: #f87171;
        }

        [data-theme="sunset"] {
            --bg-primary: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            --text-primary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.3);
            --error-color: #dc2626;
        }
        */

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .weather-container {
            max-width: 20rem;
            margin: 0 auto;
            padding: 1.75rem 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .stat-band {
            display: contents;
        }

        .sky-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.625rem;
            order: 5;
        }

        current-weather { order: 1; }
        weather-alerts { order: 2; }
        weather-insights { order: 3; }
        hourly-forecast { order: 4; }
        daily-forecast { order: 6; }

        /* Opt-in widgets sit after the hero sequence, in source order. */
        enhanced-temperature-trends,
        precipitation-radar,
        clothing-recommendations,
        air-quality,
        wind-direction,
        pressure-trends,
        hourly-timeline,
        help-section { order: 7; }

        @media (min-width: 640px) {
            .weather-container {
                max-width: 24rem;
                padding: 1.5rem 1rem;
            }
        }

        @media (min-width: 768px) {
            .weather-container {
                max-width: 28rem;
            }
        }

        @media (min-width: 1024px) {
            .weather-container {
                max-width: 32rem;
                padding: 2rem 1rem;
            }
        }

        @media (min-width: 1280px) {
            .weather-container {
                max-width: 36rem;
            }
        }

        @media (min-width: 1536px) {
            .weather-container {
                max-width: 42rem;
            }
        }

        /* eInk theme - full viewport width for high-contrast displays */
        [data-theme="eink"] .weather-container {
            max-width: none;
            width: 100%;
            height: 100vh;
            padding: 0.5rem;
            box-sizing: border-box;
            gap: 0.5rem;
        }

        [data-theme="eink"] .app-footer { display: none; }
        [data-theme="eink"] .pwa-install-button { display: none; }

        [data-theme="eink"] .stat-band {
            display: flex;
            align-items: center;
            gap: 1.375rem;
            padding: 0.625rem 1rem;
            background: #ffffff;
            border: 2px solid #000;
            box-sizing: border-box;
            min-height: 8.25rem;
            order: 2;
        }

        [data-theme="eink"] weather-alerts { order: 1; }
        [data-theme="eink"] hourly-forecast { order: 3; flex: 1; }
        [data-theme="eink"] weather-insights { order: 4; }

        [data-theme="eink"] current-weather {
            order: 0;
            flex: 1;
            min-width: 0;
        }

        [data-theme="eink"] .sky-pair {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.375rem;
            flex: 0 1 6.3125rem;
            margin-left: auto;
            text-align: right;
            order: 0;
        }

        /*
         * The mock's band is an 800px row. Below 640 that row needs about
         * 391px of content in 268px, so the high and low line overflows its
         * own column. Stacking gives the current widget the full width and
         * turns the sky rail into two cards side by side.
         */
        @media (max-width: 640px) {
            [data-theme="eink"] .stat-band {
                flex-direction: column;
                align-items: stretch;
            }

            [data-theme="eink"] .sky-pair {
                grid-template-columns: 1fr 1fr;
                flex: 0 0 auto;
                text-align: left;
            }
        }
    </style>
</head>
<body id="app-body">
    <div class="weather-container">
        <weather-alerts></weather-alerts>
        <div class="stat-band">
            <current-weather></current-weather>
            <div class="sky-pair">
                <solar-progress></solar-progress>
                <moon-phase></moon-phase>
            </div>
        </div>
        <weather-insights></weather-insights>
        <hourly-forecast></hourly-forecast>
        <daily-forecast></daily-forecast>

        <!-- Opt-in widgets, unchanged order -->
        <enhanced-temperature-trends></enhanced-temperature-trends>
        <precipitation-radar></precipitation-radar>
        <clothing-recommendations></clothing-recommendations>
        <air-quality></air-quality>
        <wind-direction></wind-direction>
        <pressure-trends></pressure-trends>
        <hourly-timeline></hourly-timeline>
        <help-section></help-section>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="footer-content">
            <div class="footer-left">
                <span class="git-hash">{{ git_hash }}</span>
            </div>
            <div class="footer-right">
                <span class="copyright">© <a href="https://harperrules.com" target="_blank" rel="noopener noreferrer">Harper Rules, LLC</a></span>
            </div>
        </div>
    </footer>

    <!-- Socket.IO client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script src="/static/js/dashboard-config.js"></script>
    <script>
        window.weatherDashboardConfig = window.DashboardConfig.parseDashboardConfig(
            window.location.search
        );
        window.DashboardConfig.applyDashboardConfig(
            document,
            window.weatherDashboardConfig
        );
    </script>

    <!-- Real-time weather manager -->
    <script src="/static/js/realtime-weather.js"></script>

    <!-- Insight rules -->
    <script src="/static/js/weather-insights.js"></script>

    <!-- Weather components -->
    <script src="/static/js/weather-components.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('Service Worker registered with scope:', registration.scope);

                        // Check for updates
                        registration.addEventListener('updatefound', function() {
                            const newWorker = registration.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', function() {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        // New content is available, prompt user to reload
                                        if (confirm('New version available! Reload to update?')) {
                                            window.location.reload();
                                        }
                                    }
                                });
                            }
                        });
                    })
                    .catch(function(error) {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // Listen for messages from service worker
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'weather-update') {
                    // Handle weather update from service worker
                    console.log('Weather update received from service worker:', event.data.data);
                    // You can dispatch a custom event here to update the UI
                }
            });
        }

        // Add install prompt for PWA
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', function(e) {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            deferredPrompt = e;

            // Add install button or show install banner
            console.log('PWA install prompt available');

            // Example: Add install button to UI
            const installButton = document.createElement('button');
            installButton.textContent = 'Install App';
            installButton.className = 'pwa-install-button';
            installButton.setAttribute('aria-label', 'Install Weather Dashboard as an app');
            installButton.setAttribute('title', 'Install this app on your device');

            installButton.addEventListener('click', function() {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function(choiceResult) {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the PWA install prompt');
                    } else {
                        console.log('User dismissed the PWA install prompt');
                    }
                    deferredPrompt = null;
                    document.body.removeChild(installButton);
                });
            });

            document.body.appendChild(installButton);
        });

        // Handle PWA install success
        window.addEventListener('appinstalled', function(e) {
            console.log('PWA was installed successfully');
        });
    </script>
</body>
</html>
